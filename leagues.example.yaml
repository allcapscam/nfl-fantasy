# Copy to leagues.yaml and fill in. leagues.yaml is gitignored.
#
# Roster slots and scoring are NOT configured here -- `draftbot sync` pulls them
# from each platform so they can't drift out of date with the real league.
#
# Finding your league id:
#   Sleeper  the number in app.sleeper.com/leagues/<LEAGUE_ID>/...
#   ESPN     the leagueId=<ID> parameter in the fantasy.espn.com URL
#   Yahoo    the number in football.fantasysports.yahoo.com/f1/<LEAGUE_ID>

leagues:
  home:
    platform: sleeper
    league_id: "REPLACE_ME"
    strategy: strategies/balanced.yaml

  work:
    platform: espn
    league_id: "REPLACE_ME"
    strategy: strategies/balanced.yaml

  money:
    platform: yahoo
    league_id: "REPLACE_ME"
    strategy: strategies/hero-rb.yaml

  dynasty:
    platform: sleeper
    league_id: "REPLACE_ME"
    strategy: strategies/hero-rb.yaml
    enabled: false

# When a platform can't be read -- Yahoo's API needs manual approval, ESPN has
# no adapter yet -- you can enter the league's rules by hand. `sync` prefers the
# platform and only falls back to this, so a readable league never drifts.
#
# A queue only needs the roster shape and the scoring format, so a league with
# manual settings can still export one.
#
#  money:
#    platform: yahoo
#    league_id: "REPLACE_ME"
#    strategy: strategies/balanced.yaml
#    manual:
#      teams: 12
#      scoring: half_ppr        # standard | half_ppr | ppr
