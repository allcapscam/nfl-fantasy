# Copy to strategy.yaml and edit. strategy.yaml is gitignored so your real
# edge stays out of a public repo.

name: "zero-RB lean"

league:
  teams: 12
  draft_slot: 4          # your first-round pick, 1-indexed
  scoring: half_ppr      # standard | half_ppr | ppr
  roster:
    QB: 1
    RB: 2
    WR: 2
    TE: 1
    FLEX: 1
    K: 1
    DST: 1
    BENCH: 6

# Hard constraints. The bot will never violate these.
earliest_round:
  QB: 5      # no quarterback before round 5
  TE: 4
  K: 14
  DST: 13

max_per_position:
  QB: 2
  TE: 2
  K: 1
  DST: 1

# Soft preferences. These rank the players that pass the constraints above.
position_weight:
  WR: 1.10
  RB: 0.95

round_plan:
  - round: 1
    prefer: [WR]
    avoid: [QB, TE, K, DST]
  - round: 2
    prefer: [WR, RB]
    avoid: [K, DST]
  - round: 3
    prefer: [RB, WR]
  - round: 5
    prefer: [QB, RB]

# How many ADP slots early the bot will take a player it wants.
reach_tolerance: 8
